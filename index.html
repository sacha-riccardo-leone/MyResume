<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Sacha Riccardo Leone — Développeur d'applications</title>
    <meta
      name="description"
      content="Développeur d'applications en Suisse. Mandats livrés en production, du frontend à l'infrastructure. CV et portfolio interactif."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#0a0a0b" />

    <!-- Link preview: this URL gets pasted into LinkedIn and emails, so it
         should unfurl as a card rather than a bare link. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Sacha Riccardo Leone" />
    <meta property="og:title" content="Sacha Riccardo Leone — Développeur d'applications" />
    <meta
      property="og:description"
      content="Des besoins réels, des logiciels livrés. CV et portfolio interactif."
    />
    <meta property="og:url" content="https://resume-sacha-leone.vercel.app/" />
    <meta property="og:image" content="https://resume-sacha-leone.vercel.app/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <style>
      /* Match the app's ground so there is no pale flash before CSS loads.
         The boot script below overrides this for light mode. */
      html, body { height: 100%; margin: 0; background: #0a0a0b; scrollbar-gutter: stable; }
      #root { height: 100%; }
    </style>

    <!-- Decide the theme BEFORE first paint: a saved choice wins, otherwise the
         OS preference. Running this inline and synchronously in <head> is what
         prevents a flash of the wrong theme on load. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("srl.theme");
          var theme = saved === "light" || saved === "dark"
            ? saved
            : (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
          document.documentElement.setAttribute("data-theme", theme);
          document.documentElement.style.colorScheme = theme;
          if (theme === "light") document.documentElement.style.background = "#f4f4f2";
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
